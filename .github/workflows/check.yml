name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both architectures run the whole gate, not just a compile. `soul-mod stamp`
  # and `soul-mod verify` execute the artifact to read its schema back, so a
  # cross-compiled binary cannot be stamped on a foreign host — each arch has to
  # do its own (NIM-493). Native runners make that a non-issue and keep QEMU out
  # of the picture.
  #
  # The `live` job that stood beside this one until NIM-868 is gone with the
  # implementation it tested: it drove `make l1` over a matrix of real Redis
  # servers on behalf of the `cmd/` + `internal/acl/` layout this repository
  # carried, and the implementation that replaced it has no L1 lane and no target
  # by that name. A workflow calling a target that does not exist is a
  # permanently-red CI, which is how a gate stops being read.
  check:
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # `go install .../sdk/cmd/soul-mod@v0.1.0-beta.1` does NOT work and cannot be made
      # to: the published sdk module's own go.mod carries `replace ... => ../proto/plugin`,
      # and Go refuses `install pkg@version` for any module whose go.mod has a replace.
      # That relative path resolves only inside a full checkout, so build it from one.
      - name: Build soul-mod from the core repository
        run: |
          mkdir -p "$HOME/.local/bin"
          git clone --depth 1 --branch sdk/v0.1.0-beta.1 \
            https://github.com/souls-guild/soul-stack.git /tmp/soul-stack
          cd /tmp/soul-stack && GOWORK= go build -o "$HOME/.local/bin/soul-mod" ./sdk/cmd/soul-mod
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gofmt, vet, no-replace, test, build, stamp, verify
        run: make check
