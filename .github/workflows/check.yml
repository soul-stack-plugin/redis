name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both architectures run the whole gate, not just a compile. `soul-mod stamp`
  # and `soul-mod verify` execute the artifact to read its schema back, so a
  # cross-compiled binary cannot be stamped on a foreign host — each arch has to
  # do its own (NIM-493). Native runners make that a non-issue and keep QEMU out
  # of the picture.
  #
  # The `live` job that stood beside this one until NIM-868 is gone with the
  # implementation it tested: it drove `make l1` over a matrix of real Redis
  # servers on behalf of the `cmd/` + `internal/acl/` layout this repository
  # carried, and the implementation that replaced it has no L1 lane and no target
  # by that name. A workflow calling a target that does not exist is a
  # permanently-red CI, which is how a gate stops being read.
  check:
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # `make ci`, not `make check`, and the missing target is `schema`.
      #
      # That step needs `soul-mod`, which is built from souls-guild/soul-stack — a PRIVATE
      # repository. There is no way to get the tool onto a public runner: `go install
      # .../sdk/cmd/soul-mod@v0.1.0-beta.1` is refused because the published sdk module's
      # own go.mod carries `replace ... => ../proto/plugin`, and cloning the core needs a
      # credential this repository has not been given.
      #
      # ★ The document is still gated, one repository over: soul-stack vendors a copy of
      # `schema.json` and its `check-plugin-schema` builds THIS artifact at a pinned commit,
      # stamps it for real, and refuses unless the two are byte-identical. So a drift is
      # caught there rather than here — later, but not never. Run `make check` locally.
      - name: gofmt, vet, no-replace, test
        run: make ci
