name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both architectures run the whole gate, not just a compile. `soul-mod stamp`
  # and `soul-mod verify` execute the artifact to read its schema back, so a
  # cross-compiled binary cannot be stamped on a foreign host — each arch has to
  # do its own (NIM-493). Native runners make that a non-issue and keep QEMU out
  # of the picture.
  #
  # The `live` job that stood beside this one until NIM-868 is gone with the
  # implementation it tested: it drove `make l1` over a matrix of real Redis
  # servers on behalf of the `cmd/` + `internal/acl/` layout this repository
  # carried, and the implementation that replaced it has no L1 lane and no target
  # by that name. A workflow calling a target that does not exist is a
  # permanently-red CI, which is how a gate stops being read.
  check:
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install soul-mod
        run: go install github.com/souls-guild/soul-stack/sdk/cmd/soul-mod@v0.1.0-beta.1

      - name: gofmt, vet, no-replace, test, build, stamp, verify
        run: make check
