name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job per architecture on a native runner. `soul-mod stamp` reads the
  # schema back out of the artifact by running it, so a cross-compiled binary
  # cannot be stamped elsewhere (NIM-493) — each arch stamps its own.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # A release CANNOT be cut without `soul-mod`: `make build` stamps the artifact, and an
      # unstamped artifact carries no disclosure, so every keeper-side reader fails closed.
      #
      # The tool is built from souls-guild/soul-stack, which is PRIVATE. `go install
      # .../sdk/cmd/soul-mod@version` is refused regardless (the published sdk module's
      # go.mod carries `replace ... => ../proto/plugin`), so a full checkout of the core is
      # the only source — and reaching it needs a credential.
      #
      # This fails with a NAMED reason rather than on git's credential prompt, which is what
      # an unauthenticated clone produces: `could not read Username for https://github.com`
      # says nothing about which repository or why.
      - name: Build soul-mod from the core repository
        env:
          CORE_TOKEN: ${{ secrets.SOUL_STACK_CORE_TOKEN }}
        run: |
          if [ -z "$CORE_TOKEN" ]; then
            echo "::error::soul-mod is built from souls-guild/soul-stack, which is private, and"
            echo "::error::the SOUL_STACK_CORE_TOKEN secret (read access to it) is not set on this"
            echo "::error::repository. Either set it, or cut the release from a workstation that has"
            echo "::error::a core checkout: make build && make verify."
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          git clone --depth 1 --branch sdk/v0.1.0-beta.1 \
            "https://x-access-token:${CORE_TOKEN}@github.com/souls-guild/soul-stack.git" /tmp/soul-stack
          cd /tmp/soul-stack && GOWORK= go build -o "$HOME/.local/bin/soul-mod" ./sdk/cmd/soul-mod
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and stamp
        run: make build

      # An unstamped artifact carries no disclosure, and a Keeper that cannot
      # read the disclosure fails closed rather than approving blind. Verify
      # before the bytes leave the runner, not after.
      - name: Verify the stamp
        run: make verify

      - name: Name the artifact and hash it
        run: |
          bin="redis-linux-${{ matrix.arch }}"
          mv dist/redis "$bin"
          sha256sum "$bin" > "$bin.sha256"
          cat "$bin.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: redis-linux-${{ matrix.arch }}
          path: |
            redis-linux-${{ matrix.arch }}
            redis-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

      # The schema document is derived from Go values and carries nothing about
      # the platform — the two architectures produce it byte for byte identical.
      # Publish it once, from amd64, so `soul-lint` can check a destiny without
      # downloading an artifact for an architecture it does not care about.
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: schema
          path: dist/schema.json
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The two architectures agree on the schema by construction, but "by
      # construction" is what a release is supposed to check rather than assume:
      # a mismatch here means the two binaries do not describe the same module.
      - name: Both architectures must describe the same module
        run: |
          ls -l assets
          for arch in amd64 arm64; do
            test -s "assets/redis-linux-$arch" || { echo "missing artifact for $arch"; exit 1; }
            (cd assets && sha256sum -c "redis-linux-$arch.sha256")
          done
          test -s assets/schema.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            assets/redis-linux-amd64 \
            assets/redis-linux-amd64.sha256 \
            assets/redis-linux-arm64 \
            assets/redis-linux-arm64.sha256 \
            assets/schema.json \
            --clobber
